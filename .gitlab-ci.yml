image: mcr.microsoft.com/dotnet/sdk:10.0

variables:
  VERSION: "3.1.1"

stages:
  - build

.build:
  stage: build
  before_script:
    - dotnet tool install Fallout.GlobalTool --global --no-cache
    - export PATH="$PATH:/root/.dotnet/tools"
  script:
    # - dotnet restore MeasureMap.sln
    - dotnet restore ./build/_build.csproj
    - fallout release -isrc ${ISRC} -buildno ${CI_PIPELINE_IID} -version ${VERSION} -runtests false
  artifacts:
    paths:
      - artifacts/*.nupkg
      - artifacts/*.snupkg

build-dev:
  only:
    - dev
  variables:
    ISRC: "true"
  extends: .build

build-master:
  only:
    - master
  variables:
    ISRC: "false"
  extends: .build